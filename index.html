<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حدد موعد الاختبار</title>
    
    <!-- تحميل المكتبات اللازمة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK v8 Compatibility -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        * { font-family: 'Tajawal', sans-serif; }

        body {
            background-color: #f0f9ff; /* سماوي فاتح جداً */
            background-image: radial-gradient(#bae6fd 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        .golden-border {
            border: 2px solid #fbbf24;
        }

        .sky-gradient {
            background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
        }

        .royal-card {
            box-shadow: 0 10px 30px -5px rgba(2, 132, 199, 0.1);
            transition: all 0.3s ease;
        }

        .royal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(2, 132, 199, 0.15);
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f0f9ff; }
        ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // إعدادات فايربيز (تلقائية من البيئة)
        const firebaseConfig = JSON.parse(__firebase_config);
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'exam-booking-app';

        // رابط جوجل شيت الذي قمتِ بتزويدي به
        const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxlnZY4QfrySeY_GuQ8xTBSSgPKVTSZ0hfRGcZVd_02IwF6W3ynr_cvPRQduhuUUSXs/exec"; 

        const TEACHERS = [
            { id: 't1', name: 'إيمان جابر', duration: 20, slots: 2 },
            { id: 't2', name: 'إيمان حسن الخريبي', duration: 20, slots: 2 },
            { id: 't3', name: 'شمس أسامة', duration: 20, slots: 2 },
            { id: 't4', name: 'أميمة شاكر', duration: 20, slots: 2 },
            { id: 't5', name: 'نادين عصام', duration: 20, slots: 2 },
            { id: 't6', name: 'ميرفت', duration: 25, slots: 3 },
            { id: 't7', name: 'شيماء نعيم', duration: 30, slots: 2 },
            { id: 't8', name: 'نعمة ماهر', duration: 20, slots: 1 },
            { id: 't9', name: 'حياة المليكي', duration: 25, slots: 2 },
            { id: 't10', name: 'منار أبو العباس', duration: 20, slots: 1 }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [studentName, setStudentName] = useState('');
            const [selectedTeacher, setSelectedTeacher] = useState(TEACHERS[0]);
            const [bookings, setBookings] = useState({});
            const [loading, setLoading] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const [lastBooking, setLastBooking] = useState(null);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (e) { console.error(e); }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const path = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('reservations');
                const unsubscribe = path.onSnapshot(snap => {
                    const data = {};
                    snap.forEach(doc => data[doc.id] = doc.data());
                    setBookings(data);
                });
                return () => unsubscribe();
            }, [user]);

            const generateSlots = (teacher) => {
                const slots = [];
                let start = new Date(); start.setHours(16, 0, 0); // 4:00 PM
                let end = new Date(); end.setHours(18, 40, 0); // 6:40 PM
                while (start <= end) {
                    slots.push(start.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true }));
                    start.setMinutes(start.getMinutes() + teacher.duration);
                }
                return slots;
            };

            const handleBooking = async (time, committeeIdx) => {
                if (!studentName.trim()) { alert('يرجى إدخال اسم الطالبة أولاً'); return; }
                setIsSubmitting(true);
                const id = `${selectedTeacher.id}-${time.replace(/\s/g, '')}-${committeeIdx}`;
                const bookingData = {
                    studentName,
                    teacherName: selectedTeacher.name,
                    time,
                    committee: committeeIdx + 1,
                    timestamp: new Date().toLocaleString('ar-EG')
                };

                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('reservations').doc(id).set(bookingData);
                    
                    // إرسال للجوجل شيت
                    fetch(GOOGLE_SHEET_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(bookingData)
                    });

                    setLastBooking(bookingData);
                    setShowSuccess(true);
                    setStudentName('');
                } catch (e) { alert('حدث خطأ أثناء الحجز'); } finally { setIsSubmitting(false); }
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center text-sky-600 font-bold">
                    جاري تجهيز نظام المواعيد...
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col items-center pb-20">
                    
                    {/* Modal النجاح */}
                    {showSuccess && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-sky-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-[2rem] p-8 max-w-sm w-full text-center shadow-2xl border-2 border-amber-400 animate-bounce-short">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">✓</div>
                                <h3 className="text-2xl font-bold text-sky-900 mb-2">تم تأكيد الحجز</h3>
                                <div className="bg-sky-50 p-4 rounded-xl mb-6">
                                    <p className="text-sky-800 font-bold">موعدك: {lastBooking?.time}</p>
                                    <p className="text-amber-600 font-black mt-1">لجنة رقم: {lastBooking?.committee}</p>
                                </div>
                                <button onClick={() => setShowSuccess(false)} className="w-full py-3 bg-sky-600 text-white rounded-xl font-bold shadow-lg hover:bg-sky-700 transition-all">موافق</button>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="w-full sky-gradient pt-16 pb-32 px-6 text-center text-white relative shadow-xl">
                        <h1 className="text-4xl md:text-5xl font-black mb-3 drop-shadow-md">حدد موعد الاختبار</h1>
                        <div className="w-24 h-1.5 bg-amber-400 mx-auto rounded-full mb-4"></div>
                        <p className="text-sky-100 font-medium">المواعيد المتاحة من 4:00م حتى 6:40م</p>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-4xl w-full px-4 -mt-16">
                        <div className="bg-white/90 backdrop-blur-md rounded-[2.5rem] p-8 md:p-10 shadow-2xl border border-white mb-10">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-end">
                                <div className="space-y-3">
                                    <label className="block text-sm font-bold text-sky-900 pr-2">ادخلي اسم الطالبة</label>
                                    <input 
                                        type="text" 
                                        value={studentName} 
                                        onChange={(e) => setStudentName(e.target.value)}
                                        placeholder="الاسم الثلاثي للطالبة..."
                                        className="w-full p-4 rounded-2xl bg-sky-50/50 border-2 border-transparent focus:border-amber-400 focus:bg-white outline-none transition-all text-sky-900 font-bold"
                                    />
                                </div>
                                <div className="space-y-3">
                                    <label className="block text-sm font-bold text-sky-900 pr-2">اختاري اسم المعلمة</label>
                                    <select 
                                        value={selectedTeacher.id} 
                                        onChange={(e) => setSelectedTeacher(TEACHERS.find(t => t.id === e.target.value))}
                                        className="w-full p-4 rounded-2xl bg-sky-50/50 border-2 border-transparent focus:border-amber-400 focus:bg-white outline-none transition-all text-sky-900 font-bold appearance-none cursor-pointer"
                                    >
                                        {TEACHERS.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Slots */}
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                            {generateSlots(selectedTeacher).map((time) => {
                                let booked = 0; let availIdx = -1;
                                for (let i = 0; i < selectedTeacher.slots; i++) {
                                    if (bookings[`${selectedTeacher.id}-${time.replace(/\s/g, '')}-${i}`]) booked++;
                                    else if (availIdx === -1) availIdx = i;
                                }
                                const isFull = booked >= selectedTeacher.slots;
                                return (
                                    <div key={time} className={`p-5 rounded-[2rem] royal-card border-2 flex flex-col items-center ${isFull ? 'bg-slate-100 border-transparent opacity-50' : 'bg-white border-white'}`}>
                                        <span className={`text-lg font-black mb-4 ${isFull ? 'text-slate-400' : 'text-sky-900'}`}>{time}</span>
                                        {!isFull && <span className="text-[10px] font-bold text-amber-500 mb-3">لجنة رقم: {availIdx + 1}</span>}
                                        <button 
                                            disabled={isFull || isSubmitting}
                                            onClick={() => handleBooking(time, availIdx)}
                                            className={`w-full py-2.5 rounded-xl font-bold text-xs transition-all shadow-md ${isFull ? 'bg-slate-300 text-slate-500' : 'bg-sky-600 text-white hover:bg-sky-700 active:scale-95'}`}
                                        >
                                            {isFull ? 'مكتمل' : 'حجز الآن'}
                                        </button>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Footer Info */}
                        <div className="mt-12 p-6 bg-white/40 border border-white rounded-[2rem] flex gap-4 items-center">
                            <div className="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center text-amber-600 font-bold text-xl">!</div>
                            <p className="text-sm text-sky-800 font-medium leading-relaxed">
                                يرجى الحضور قبل الموعد بـ 5 دقائق والتوجه مباشرة لرقم اللجنة المحدد لكِ عند الحجز.
                            </p>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
